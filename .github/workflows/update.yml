name: 每日更新屈臣氏酒窖分店資料

on:
  schedule:
    # 香港時間每日 13:31（= UTC 05:31）固定執行一次
    - cron: '31 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: w-store-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取並生成頁面
        run: node build-ww-store-list.js .

      - name: 檢查是否有變更
        id: changes
        run: |
          if git diff --quiet index.html ww-stores.json store-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "資料無變化，不提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "偵測到資料變更"
          fi

      - name: 提交更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ww-stores.json store-history.json
          git commit -m "每日更新分店資料 $(date -u +'%Y-%m-%d')"
          git push
